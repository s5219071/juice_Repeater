name: Build JuiceRepeater VST3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  windows-vst3:
    name: Windows x64 VST3
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --target JuiceRepeater_VST3 --parallel

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "JuiceRepeater.vst3" |
            Select-Object -First 1

          if ($null -eq $plugin) {
            throw "JuiceRepeater.vst3 was not found."
          }

          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -LiteralPath $plugin.FullName -Destination package -Recurse -Force
          Compress-Archive -Path "package/JuiceRepeater.vst3" `
            -DestinationPath "JuiceRepeater-Windows-x64-VST3.zip" -Force

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: JuiceRepeater-Windows-x64-VST3
          path: JuiceRepeater-Windows-x64-VST3.zip
          if-no-files-found: error

  macos-vst3:
    name: macOS Universal VST3
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure universal binary
        shell: bash
        run: >
          cmake -S . -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"

      - name: Build
        shell: bash
        run: cmake --build build --config Release --target JuiceRepeater_VST3 --parallel

      - name: Package and verify architectures
        shell: bash
        run: |
          set -euo pipefail

          plugin="$(find build -type d -name 'JuiceRepeater.vst3' -print | sed -n '1p')"
          if [[ -z "${plugin}" ]]; then
            echo "JuiceRepeater.vst3 was not found."
            exit 1
          fi

          binary="${plugin}/Contents/MacOS/JuiceRepeater"
          lipo -info "${binary}"
          lipo "${binary}" -verify_arch arm64 x86_64

          mkdir -p package
          cp -R "${plugin}" package/
          codesign --force --deep --sign - "package/JuiceRepeater.vst3"
          ditto -c -k --sequesterRsrc --keepParent \
            "package/JuiceRepeater.vst3" "JuiceRepeater-macOS-Universal-VST3.zip"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: JuiceRepeater-macOS-Universal-VST3
          path: JuiceRepeater-macOS-Universal-VST3.zip
          if-no-files-found: error
